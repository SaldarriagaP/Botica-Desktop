<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Desktop Botica - Login</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-box">
    <h1>Desktop Botica</h1>
    <p class="subtitulo">Prototipo - sucursal (offline)</p>
    <input id="username" placeholder="Usuario" autofocus />
    <input id="password" type="password" placeholder="Contraseña" />
    <button id="btnLogin">Ingresar</button>
    <p id="error" class="error"></p>
  </div>
  <script src="login.js"></script>
</body>
</html>
