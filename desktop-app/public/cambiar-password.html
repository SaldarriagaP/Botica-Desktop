<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Desktop Botica - Cambiar contraseña</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="login-refresh">
    <div class="login-refresh-card" style="grid-template-columns: 1fr; max-width: 460px; min-height: 0;">
      <section class="login-form-panel">
        <form class="login-form" id="cambioForm" novalidate>
          <div class="login-header">
            <span id="saludo">Hola</span>
            <h2>Crea una nueva contraseña</h2>
            <p>El administrador restableció tu contraseña. Antes de continuar debes elegir una nueva que solo tú conozcas.</p>
          </div>

          <p id="error" class="login-alert"></p>

          <div class="login-field">
            <label for="actual">Contraseña temporal</label>
            <div class="login-input"><input id="actual" type="password" autocomplete="current-password" required /></div>
          </div>
          <div class="login-field">
            <label for="nueva">Nueva contraseña (mínimo 6 caracteres)</label>
            <div class="login-input"><input id="nueva" type="password" autocomplete="new-password" required /></div>
          </div>
          <div class="login-field">
            <label for="nueva2">Repite la nueva contraseña</label>
            <div class="login-input"><input id="nueva2" type="password" autocomplete="new-password" required /></div>
          </div>

          <button class="login-submit" type="submit" id="btnCambiar">Guardar y continuar</button>
          <p class="login-help"><a href="#" id="salir">Cerrar sesión</a></p>
        </form>
      </section>
    </div>
  </main>
  <script src="api.js"></script>
  <script src="cambiar-password.js"></script>
</body>
</html>
